name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The dictionary (JMdict) is fetched at build time; its licence asks for the
  # data to be refreshed at least monthly, so the site is rebuilt on the 1st.
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm test
      - run: npm run lint

      # Downloads the latest JMdict release and writes the dictionary files to public/dict.
      - run: npm run dict
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Static export to out/, served from https://<user>.github.io/<repo>/
      # Accounts are on when the Supabase secrets are set (Settings → Secrets and variables → Actions).
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
